<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practical example of Async Fetch & Optional Chaining</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ebb1b1;
            color: #e0e0e0;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background-color: #00adb5;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #008f95;
        }
        .card-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .user-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .user-card h3 {
            margin: 0 0 8px 0;
            color: #4ecca3;
        }
        .user-card p {
            margin: 4px 0;
            font-size: 14px;
            color: #b0b0b0;
        }
        #status {
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Practical example of Async Fetch & Optional Chaining with public api</h1>

    <h2>Extended DummyJSON API Practice</h2>
    <button id="fetchBtn">Fetch Multiple Users</button>
    
    <div id="status"></div>
    <div id="cardContainer" class="card-container"></div>

    <!-- Linking the separate JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
